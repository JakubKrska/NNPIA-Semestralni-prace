spring.application.name=pet-care
server.port=8081

# PostgreSQL Konfigurace
spring.datasource.url=jdbc:postgresql://localhost:5433/nnpia
spring.datasource.username=nnpia
# Pokud není v systému DB_PASSWORD, pou?ije se jako výchozí 'nnpia' (to je pro lokální DB v po?ádku)
spring.datasource.password=${DB_PASSWORD:nnpia}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 Console (vypnutá)
spring.h2.console.enabled=false

# Bezpe?nostní JWT klí? (Smazali jsme natvrdo napsané heslo, vy?adujeme prom?nnou)
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000

# Konfigurace pro Groq Cloud (Kompletn? smazán gsk_ klí? ze souboru!)
openai.api.url=https://api.groq.com/openai/v1/chat/completions
openai.api.key=${GROQ_API_KEY}